<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icone.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='feedback_admin.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <title>B.A.D.E.S.P - Feedback</title>
</head>

<body>

    <h1>Feedbacks Recebidos</h1>

    <div class="container">

        {% if feedback %}

        {% for d in feedback %}
        <form action="/Feedback/Admin/Delete/{{ d['id'] }}" method="POST">

            <p><strong>Título:</strong> {{ d['titulo'] }}</p>
            <p><strong>Feedback:</strong> {{ d['feedback'] }}</p>
            <p><strong>Tipo:</strong> {{ d['tipo'] }}</p>
            <p><strong>Cargo:</strong> {{ d['cargo'] }}</p>
            <p><strong>Horário:</strong> {{ d['horario'] }}</p>

            <button type="submit">Excluir</button>

        </form>
        {% endfor %}

        {% else %}

        <p class="vazio">Nenhum feedback encontrado.</p>

        {% endif %}

    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

</body>
</html>
