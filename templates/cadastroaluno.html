<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/cadastro.css') }}">
    <title>B.A.D.E.S.P - Cadastro</title>
</head>

<body>
    <div class="container">
        <h1>Cadastro</h1>

        <form id="form-cadastro" method="POST" action="{{ url_for('rotas.cadastro2_pin') }}" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="input-container has-select">
                <select name="escola" id="select-escola" required>
                    <option value="" disabled selected>Selecione a escola</option>
                    <option value="Escola">Escola</option>
                </select>
            </div>

            {% if cargo == 'Aluno' %}
            <div class="input-container has-select">
                <select name="ano" id="select-serie" required>
                    <option value="" disabled selected>Selecione a série</option>
                    {% set anos_exibidos = [] %}
                    {% for turma in turmas %}
                    {% set ano_loop = turma.split('°')[0] %}
                    {% if ano_loop not in anos_exibidos %}
                    <option value="{{ ano_loop }}">{{ ano_loop }}° Ano</option>
                    {% set _ = anos_exibidos.append(ano_loop) %}
                    {% endif %}
                    {% endfor %}
                </select>
            </div>

            <div class="input-container has-select container-turma-escondido" id="container-turma">
                <select name="turma" id="select-turma" required>
                    <option value="" disabled selected>Selecione a turma</option>
                    {% for turma in turmas %}
                    {% set ano_t = turma.split('°')[0] %}
                    {% set serie_t = turma.split('°')[1] %}
                    <option value="{{ serie_t }}" data-ano="{{ ano_t }}">{{ serie_t }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="input-container">
                <input placeholder="PIN" type="text" name="pin" id="pin" inputmode="numeric" required maxlength="6" minlength="6">
            </div>
            <div class="input-container">
                <input placeholder="Confirmar PIN" type="text" name="confirmar" inputmode="numeric" id="confirmar" required maxlength="6" minlength="6">
            </div>

            <div class="Termos">
                <input type="checkbox" id="checkbox-termos" required>
                <p>Ao criar uma conta você concorda com os <a href="javascript:void(0);" id="link-termos">Termos de Condições</a></p>
            </div>

            <!-- Bloco expansível de Termos -->
            <div id="termosBloco" class="termos-bloco termos-escondido" style="display: none;">
                <div class="termos-header" id="termosHeader">
                    <span class="termos-titulo">Termos e Condições de Uso e Política de Privacidade</span>
                    <span class="termos-icon" id="termosIcon">▼</span>
                </div>
                {{ termos | safe }}
            </div>

            <button type="submit" class="submit-button">Confirmar</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/cadastroaluno.js') }}"></script>
</body>
</html>
