<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/icone.png') }}">
    <title>B.A.D.E.S.P - Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/404.css') }}">

    <!-- O script agora carrega externamente via static respeitando o CSP -->
    <script src="{{ url_for('static', filename='js/erro.js') }}" defer></script>

    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=release_alert" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="cabecalho glass">
        <button class="menu-btn"><span class="material-icons">menu</span></button>
        <h1 class="titulo">B.A.D.E.S.P</h1>
        <div class="perfil">
            <p>Bem vindo: Convidado!</p>
        </div>
    </header>

    <nav class="sidebar glass sobreposto">
        <ul>
            <li><a href="/Inicio"><span class="material-icons">home</span> Início</a></li>
            <li><a href="/Ajuda"><span class="material-icons">help_outline</span> Ajuda</a></li>
            <li><a href="/Feedback"><span class="material-icons">campaign</span> Feedback</a></li>

            <li>
                <!-- CORREÇÃO: Removido o onclick inline e adicionado o ID único -->
                <a href="/Logout" class="logout" id="btn-logout">
                    <span class="material-icons">logout</span>
                    Deslogar
                </a>
            </li>
        </ul>
    </nav>
    <main>

        <div class="erro-container glass">

            <div class="erro-face">
                <div class="olho esquerdo"></div>
                <div class="olho direito"></div>
                <div class="boca"></div>
            </div>

            <h1>{{ type }}</h1>

            <h2>{{ title }}</h2>
            <p>
                {{ content }}
            </p>

            <div class="botoes">
                <a href="/" class="btn-voltar">
                    Voltar ao início
                </a>
                {% if TryAgain %}
                <!-- CORREÇÃO: Removido o onclick inline e adicionado o ID único -->
                <button type="button" id="btn-recarregar">
                    Tentar novamente
                </button>
                {% endif %}
            </div>

        </div>

    </main>

</body>
</html>
